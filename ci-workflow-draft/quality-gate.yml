name: Quality Gate

on:
  pull_request:
    branches: [develop, main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for SonarCloud PR analysis

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, test, coverage gate, OWASP check
        run: mvn -B -f supermart-iot/pom.xml verify

      - name: SonarCloud PR analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -f supermart-iot/pom.xml sonar:sonar
          -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
          -Dsonar.pullrequest.branch=${{ github.head_ref }}
          -Dsonar.pullrequest.base=${{ github.base_ref }}

      - name: Upload test/coverage/OWASP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            supermart-iot/target/surefire-reports/**
            supermart-iot/target/site/jacoco/**
            supermart-iot/target/dependency-check-report.*
